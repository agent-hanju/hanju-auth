plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
    id 'maven-publish'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.7"
    }
}

dependencies {
    // Spring Security (버전은 Spring Boot BOM에서 관리)
    api 'org.springframework.security:spring-security-config'
    api 'org.springframework.security:spring-security-web'

    // Spring Boot AutoConfiguration 지원
    api 'org.springframework.boot:spring-boot-autoconfigure'

    // JWT
    api 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    api 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'

    // Logging
    api 'org.slf4j:slf4j-api'

    // Configuration Properties 지원 (JwtValidatorProperties)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

jar {
    enabled = true
    archiveClassifier = ''
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'validator'
            version = project.version

            from components.java

            pom {
                name = 'Hanju JWT Validator'
                description = 'JWT validation library for Spring Boot microservices'
                url = 'https://github.com/agent-hanju/hanju-auth'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'agent-hanju'
                        name = 'hanju'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/agent-hanju/hanju-auth.git'
                    developerConnection = 'scm:git:ssh://github.com/agent-hanju/hanju-auth.git'
                    url = 'https://github.com/agent-hanju/hanju-auth'
                }
            }
        }
    }
}
